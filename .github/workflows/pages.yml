name: Deploy site to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Stage site with referenced assets
        run: |
          mkdir -p _pages
          cp -R site/. _pages/
          if [ -d assets ]; then cp -R assets _pages/assets; fi
          find _pages -name '*.html' -exec sed -i 's#\.\./assets/#assets/#g' {} +
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./_pages
      - id: deployment
        uses: actions/deploy-pages@v4
